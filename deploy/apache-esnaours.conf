# /etc/apache2/sites-available/esnaours.fr.conf
# Relais Apache -> site ES Naours (conteneur Docker sur 127.0.0.1:3010)
# Modules requis : a2enmod proxy proxy_http headers
<VirtualHost *:80>
    ServerName esnaours.fr
    ServerAlias www.esnaours.fr

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3010/
    ProxyPassReverse / http://127.0.0.1:3010/
    RequestHeader set X-Forwarded-Proto "https" env=HTTPS
    ProxyTimeout 120

    # envoi de photos (200 Mo)
    LimitRequestBody 209715200
</VirtualHost>
