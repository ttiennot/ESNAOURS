services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./data:/app/data
    # Accessible uniquement depuis le VPS lui-même (127.0.0.1) : le serveur web
    # existant (Nginx/Apache) ou Caddy fait le relais vers l'extérieur.
    ports:
      - "127.0.0.1:${APP_PORT:-3010}:3000"

  # Caddy n'est utile que si AUCUN autre serveur web n'utilise les ports 80/443.
  # Pour l'activer : ajouter COMPOSE_PROFILES=caddy dans .env
  caddy:
    image: caddy:2.8
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
